<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{
  --accent:#d6006e; --accent-ink:#fff;
  --bg:#faf6f8; --panel:#ffffff; --panel-2:#fbf3f7;
  --ink:#241a1f; --ink-soft:#6b5b63; --ink-faint:#9a8b92;
  --line:#ecd9e3; --line-soft:#f3e7ee;
  --shadow:0 1px 2px rgba(60,10,35,.06),0 6px 20px rgba(60,10,35,.06);
  --rose-bg:#fde8ec; --rose-ink:#a3123a; --rose-line:#f4c3cf;
  --amber-bg:#fdefdc; --amber-ink:#8a5300; --amber-line:#f3d8ac;
  --teal-bg:#dcf1f0; --teal-ink:#0d5f5c; --teal-line:#b3ddda;
  --green-bg:#e2f3e5; --green-ink:#1c6b34; --green-line:#bde3c5;
  --radius:14px;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --head:"SF Pro Display","Segoe UI",Inter,var(--sans);
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root{
  --accent:#ff5ca8; --accent-ink:#2a0016;
  --bg:#171114; --panel:#221a1e; --panel-2:#2a2024;
  --ink:#f3e9ee; --ink-soft:#c3aeb8; --ink-faint:#8f7b84;
  --line:#3a2c33; --line-soft:#31252b;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  --rose-bg:#3d1622; --rose-ink:#ff9db2; --rose-line:#5c2231;
  --amber-bg:#3a2913; --amber-ink:#f0c078; --amber-line:#5a4020;
  --teal-bg:#123534; --teal-ink:#7fd6d1; --teal-line:#1e514f;
  --green-bg:#163220; --green-ink:#8fe0a3; --green-line:#245235;
}}
:root[data-theme="light"]{
  --accent:#d6006e; --accent-ink:#fff; --bg:#faf6f8; --panel:#ffffff; --panel-2:#fbf3f7;
  --ink:#241a1f; --ink-soft:#6b5b63; --ink-faint:#9a8b92; --line:#ecd9e3; --line-soft:#f3e7ee;
  --shadow:0 1px 2px rgba(60,10,35,.06),0 6px 20px rgba(60,10,35,.06);
  --rose-bg:#fde8ec; --rose-ink:#a3123a; --rose-line:#f4c3cf;
  --amber-bg:#fdefdc; --amber-ink:#8a5300; --amber-line:#f3d8ac;
  --teal-bg:#dcf1f0; --teal-ink:#0d5f5c; --teal-line:#b3ddda;
  --green-bg:#e2f3e5; --green-ink:#1c6b34; --green-line:#bde3c5;
}
:root[data-theme="dark"]{
  --accent:#ff5ca8; --accent-ink:#2a0016; --bg:#171114; --panel:#221a1e; --panel-2:#2a2024;
  --ink:#f3e9ee; --ink-soft:#c3aeb8; --ink-faint:#8f7b84; --line:#3a2c33; --line-soft:#31252b;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  --rose-bg:#3d1622; --rose-ink:#ff9db2; --rose-line:#5c2231;
  --amber-bg:#3a2913; --amber-ink:#f0c078; --amber-line:#5a4020;
  --teal-bg:#123534; --teal-ink:#7fd6d1; --teal-line:#1e514f;
  --green-bg:#163220; --green-ink:#8fe0a3; --green-line:#245235;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
  font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px 80px}
h1,h2,h3{font-family:var(--head);font-weight:700;letter-spacing:-.01em;text-wrap:balance;margin:0}
.tnum{font-variant-numeric:tabular-nums}

/* header */
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line);margin-bottom:22px}
.hrow{max-width:1120px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px}
.brand h1{font-size:20px}
.brand .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);align-self:center}
.brand small{color:var(--ink-faint);font-size:12.5px}
.stats{display:flex;gap:18px;margin-left:auto;flex-wrap:wrap}
.stat{display:flex;flex-direction:column;line-height:1.15}
.stat b{font-family:var(--head);font-size:19px}
.stat span{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-faint)}
.filters{display:flex;gap:8px;flex-wrap:wrap;padding:0 0 12px}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--ink-soft);
  padding:6px 12px;border-radius:999px;font-size:13px;cursor:pointer;font-weight:600;
  display:inline-flex;align-items:center;gap:7px;transition:.12s}
.chip .n{font-variant-numeric:tabular-nums;color:var(--ink-faint);font-weight:700}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip[aria-pressed="true"] .n{color:var(--accent-ink);opacity:.8}
.searchbox{margin-left:auto;position:relative}
.searchbox input{border:1px solid var(--line);background:var(--panel);color:var(--ink);
  border-radius:999px;padding:7px 14px;font-size:13.5px;width:230px;font-family:var(--sans)}
.searchbox input:focus{outline:2px solid var(--accent);outline-offset:1px}

/* order card */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);margin-bottom:16px;overflow:hidden;
  display:grid;grid-template-columns:1fr 262px}
.card.urgent{border-color:var(--rose-line)}
.card.expedited{border-color:var(--accent);box-shadow:inset 4px 0 0 var(--accent)}
.airimg{margin:8px 0 2px}
.airimg img{max-width:100%;width:420px;border:1px solid var(--line);border-radius:8px;display:block}
.airhint{font-size:12px;color:var(--ink-soft);margin-top:5px;line-height:1.45}
.cbody{min-width:0}
.cside{border-left:1px solid var(--line-soft);background:var(--panel-2);
  padding:14px;display:flex;flex-direction:column;gap:10px}
.cside .chkrow{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:700;
  color:var(--ink-soft);cursor:pointer;user-select:none;padding:2px}
.cside .chkrow input{width:19px;height:19px;accent-color:var(--green-ink);cursor:pointer;margin:0;flex:none}
.cside .chkrow.on{color:var(--green-ink)}
.card.contacted-on .cside{background:var(--green-bg)}
.card.contacted-on{border-color:var(--green-line)}
.b-new{background:color-mix(in srgb,#7c3aed 15%,transparent);color:#6d28d9;
  border:1px solid color-mix(in srgb,#7c3aed 38%,transparent)}
@media (prefers-color-scheme:dark){.b-new{color:#c4b5fd}}
:root[data-theme="dark"] .b-new{color:#c4b5fd}
:root[data-theme="light"] .b-new{color:#6d28d9}
.donecard{opacity:.96}
.donecard .prod{white-space:pre-wrap}
.cside .nlab{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint)}
.cside .cnote{flex:1;min-height:96px;border:1px solid var(--line);border-radius:10px;
  background:var(--panel);color:var(--ink);padding:10px 11px;font-family:var(--sans);
  font-size:13px;line-height:1.45;resize:vertical}
.cside .cnote:focus{outline:2px solid var(--accent);outline-offset:1px}
.cside .saved{font-size:11px;color:var(--green-ink);min-height:14px;opacity:0;transition:.2s}
.cside .saved.show{opacity:1}
@media(max-width:720px){.card{grid-template-columns:1fr}
  .cside{border-left:none;border-top:1px solid var(--line-soft)}}
.chead{display:flex;gap:14px;align-items:flex-start;padding:16px 18px;flex-wrap:wrap;
  border-bottom:1px solid var(--line-soft)}
.cust{min-width:200px}
.cust .name{font-family:var(--head);font-size:17px;font-weight:700}
.cust .cid{color:var(--ink-faint);font-size:12px;font-variant-numeric:tabular-nums}
.refs{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto;align-items:center}
.ref{display:inline-flex;align-items:center;gap:6px;background:var(--panel-2);border:1px solid var(--line-soft);
  border-radius:9px;padding:5px 8px 5px 10px;font-size:12.5px}
.ref .lab{color:var(--ink-faint);text-transform:uppercase;letter-spacing:.05em;font-size:10px;font-weight:700}
.ref .val{font-variant-numeric:tabular-nums;font-weight:600;font-family:var(--mono);font-size:12.5px}
.copy{border:none;background:transparent;color:var(--ink-faint);cursor:pointer;padding:3px;border-radius:6px;
  display:inline-flex;line-height:0;transition:.12s}
.copy:hover{color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}
.copy svg{width:14px;height:14px}
.emails{display:flex;flex-wrap:wrap;gap:6px;width:100%;margin-top:4px}
.email{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-soft);
  background:var(--panel-2);border:1px solid var(--line-soft);border-radius:8px;padding:4px 6px 4px 10px}
.email .addr{font-family:var(--mono);font-size:12.5px}

/* lines */
.lines{padding:6px 18px 8px}
.line{display:grid;grid-template-columns:1fr auto;gap:8px 16px;padding:14px 0;border-bottom:1px dashed var(--line-soft)}
.line:last-child{border-bottom:none}
.litem{display:flex;flex-direction:column;gap:4px}
.sku{font-family:var(--mono);font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:8px}
.prod{color:var(--ink-soft);font-size:13.5px}
.badges{display:flex;gap:7px;flex-wrap:wrap;margin-top:2px;align-items:center}
.badge{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;border:1px solid;
  display:inline-flex;align-items:center;gap:5px;letter-spacing:.01em}
.b-disc{background:var(--amber-bg);color:var(--amber-ink);border-color:var(--amber-line)}
.b-discx{background:var(--rose-bg);color:var(--rose-ink);border-color:var(--rose-line)}
.b-back{background:var(--teal-bg);color:var(--teal-ink);border-color:var(--teal-line)}
.b-swap{background:var(--green-bg);color:var(--green-ink);border-color:var(--green-line)}
.b-plain{background:var(--panel-2);color:var(--ink-soft);border-color:var(--line)}
.b-air{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.timing{font-size:12.5px;color:var(--ink-soft);margin-top:2px}
.timing b{color:var(--ink);font-weight:600}
.lqty{text-align:right;font-size:12.5px;color:var(--ink-faint);white-space:nowrap}
.lqty b{display:block;font-family:var(--head);font-size:18px;color:var(--ink);font-variant-numeric:tabular-nums}

/* swap dropdown */
.swap{grid-column:1/-1;margin-top:4px}
details.swap>summary{list-style:none;cursor:pointer;display:inline-flex;align-items:center;gap:8px;
  font-size:13px;font-weight:600;color:var(--accent);padding:6px 10px;border:1px solid var(--line);
  border-radius:9px;background:var(--panel-2);user-select:none}
details.swap>summary::-webkit-details-marker{display:none}
details.swap>summary .chev{transition:.15s;display:inline-flex}
details.swap[open]>summary .chev{transform:rotate(90deg)}
.swaplist{margin-top:8px;border:1px solid var(--line-soft);border-radius:10px;overflow:hidden;max-height:260px;overflow-y:auto}
.swaprow{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line-soft);font-size:13px}
.swaprow:last-child{border-bottom:none}
.swaprow.sel{background:var(--green-bg)}
.swaprow .ssku{font-family:var(--mono);font-weight:600}
.swaprow .tag{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:2px 7px;border-radius:999px;
  background:var(--panel-2);border:1px solid var(--line);color:var(--ink-faint)}
.swaprow .tag.match{background:var(--green-bg);color:var(--green-ink);border-color:var(--green-line)}
.swaprow .av{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--ink-soft)}
.swaprow .av b{color:var(--green-ink)}
.pick{border:1px solid var(--line);background:var(--panel);color:var(--ink-soft);border-radius:7px;
  padding:4px 10px;font-size:12px;font-weight:600;cursor:pointer}
.pick:hover{border-color:var(--accent);color:var(--accent)}
.pick.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.noswap{font-size:12.5px;color:var(--rose-ink);font-weight:600;margin-top:4px}

/* email panel */
.cfoot{padding:12px 18px 16px;background:var(--panel-2);border-top:1px solid var(--line-soft)}
.btn{border:none;border-radius:10px;padding:9px 16px;font-size:13.5px;font-weight:700;cursor:pointer;
  display:inline-flex;align-items:center;gap:8px;font-family:var(--sans)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--panel);color:var(--ink-soft);border:1px solid var(--line)}
.btn svg{width:15px;height:15px}
.draftwrap{margin-top:12px;display:none}
.draftwrap.show{display:block}
.draftwrap textarea{width:100%;min-height:230px;border:1px solid var(--line);border-radius:10px;background:var(--panel);
  color:var(--ink);padding:14px;font-family:var(--sans);font-size:13.5px;line-height:1.55;resize:vertical}
.draftwrap textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
.timingwrap{margin-top:14px;padding-top:12px;border-top:1px solid var(--line-soft)}
.timingwrap textarea{min-height:150px}
.timingwrap .nlab{margin-bottom:6px}
.subj{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:13px}
.subj .lab{color:var(--ink-faint);text-transform:uppercase;letter-spacing:.05em;font-size:10px;font-weight:700}
.subj input{flex:1;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);
  padding:7px 10px;font-size:13px;font-family:var(--sans)}
.draftbtns{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}

.empty{text-align:center;padding:60px 20px;color:var(--ink-faint)}
.foot{margin-top:26px;color:var(--ink-faint);font-size:12px;text-align:center;line-height:1.7}
.foot code{font-family:var(--mono);background:var(--panel-2);padding:1px 6px;border-radius:5px}

/* toast */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);opacity:0;
  background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;font-size:13.5px;font-weight:600;
  box-shadow:var(--shadow);transition:.2s;pointer-events:none;z-index:50}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:640px){.line{grid-template-columns:1fr}.lqty{text-align:left}.searchbox input{width:150px}}

[hidden]{display:none!important}
.auth-gate{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;
  background:var(--bg);padding:24px}
.auth-card{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--line);
  border-radius:18px;box-shadow:var(--shadow);padding:30px 26px;text-align:center}
.auth-card .mark{width:64px;height:64px;border-radius:16px;margin:0 auto 14px;display:block}
.auth-card h2{font-family:var(--head);font-size:22px;margin:0 0 6px}
.auth-card p{color:var(--ink-soft);font-size:13.5px;margin:0 0 18px}
.auth-card input{width:100%;border:1px solid var(--line);background:var(--panel-2);color:var(--ink);
  border-radius:10px;padding:11px 13px;font-size:15px;font-family:var(--sans);margin-bottom:10px;text-align:center}
.auth-card input:focus{outline:2px solid var(--accent);outline-offset:1px}
.auth-card .btn{width:100%;justify-content:center;margin-bottom:8px}
.auth-err{color:var(--rose-ink);font-size:12.5px;min-height:16px;margin-top:4px}
.signout{position:fixed;bottom:14px;right:16px;z-index:40;font-size:12px;color:var(--ink-faint);
  background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px 10px;cursor:pointer}
</style>

function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");
  clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("show"),1600);}
async function copy(text,label){
  try{await navigator.clipboard.writeText(text);}
  catch(e){const ta=document.createElement("textarea");ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand("copy");ta.remove();}
  toast((label||"Copied")+" copied");
}
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
/* copy the email as rich HTML (image inline) + plain-text fallback, one paste into Gmail */
async function copyRich(card){
  const bodyText=card.querySelector("[data-body]").value;
  const html=card._emailHtml || bodyText.split("\n").map(l=>l?`<p>${esc(l)}</p>`:"<br>").join("");
  try{
    if(navigator.clipboard&&window.ClipboardItem){
      await navigator.clipboard.write([new ClipboardItem({
        "text/html":new Blob([html],{type:"text/html"}),
        "text/plain":new Blob([bodyText],{type:"text/plain"})
      })]);
      toast("Email + image copied");return;
    }
    throw 0;
  }catch(err){ await copy(bodyText); toast("Text copied — drag the image into Gmail"); }
}
const mdDate=s=>{const p=(s||"").split("/");return p.length>=2?p[0]+"/"+p[1]:s;};

/* ---- email builder (reactive to selected swaps) ---- */
function swapList(o,i){const s=o._sel[i]||[];return s.length?(s.length===1?s[0]:s.slice(0,-1).join(", ")+" or "+s[s.length-1]):"";}
// true when the nearest SELECTED swap is 2+ sizes away (not a nearing size)
function swapFar(o,i,ln){
  const sel=o._sel[i]||[]; if(!sel.length) return false;
  let minS=Infinity;
  sel.forEach(sku=>{const s=(ln.swaps||[]).find(x=>x.sku===sku); if(s&&typeof s.steps==="number") minS=Math.min(minS,s.steps);});
  return minS!==Infinity && minS>=2;
}
function closingLine(o){
  const allNew=o.lines.every(ln=>ln.is_new&&!ln.obsolete);
  return allNew
    ? "Terribly sorry for any inconvenience. Please let me know if you have any questions in the meantime, happy to help!"
    : "Terribly sorry for any inconvenience. Please let me know how you would like to proceed, happy to help!";
}
/* MAIN email — informs + offers swaps. No arrival dates, no refund offer.
   (Arrival timing is a separate "if they ask" reply — see buildTimingEmail.) */
function buildMulti(o,g,ref,when){
  const bullets=o.lines.map((ln,i)=>{
    const list=swapList(o,i), plural=ln.bo_qty>1, pron=plural?"them":"it";
    const item=`${ln.sku} (${ln.product})${plural?` (${ln.bo_qty} backordered)`:""}`;
    const far=swapFar(o,i,ln), many=(o._sel[i]||[]).length>1;
    const nextBest=`the next best size${many?"s":""} we have available ${many?"are":"is"} ${list} to swap to`;
    if(ln.obsolete){
      if(!list) return `${item} — discontinued, so we won't be receiving more of ${pron}, and we don't have a nearing size or colorway to offer as a swap.`;
      return far
        ? `${item} — discontinued, so we won't be receiving more; ${nextBest}.`
        : `${item} — discontinued, so we won't be receiving more; we do have ${list} available to swap to.`;
    }
    const word=ln.is_new?"a brand-new item we're awaiting our first shipment of":"on backorder";
    if(!list) return `${item} — ${word}; we'll get ${pron} shipped out to you as soon as ${plural?"they're":"it's"} available.`;
    return far
      ? `${item} — ${word}; ${nextBest} and ship right away.`
      : `${item} — ${word}; we do have ${list} available to swap to and ship right away.`;
  });
  const body=`Hi ${g},\n\nI am reaching out regarding your recent order, order #${ref}, placed on ${when}. `
    +`It seems a few items on your order are unfortunately unavailable right now:\n\n`
    +bullets.map(b=>"• "+b).join("\n")+`\n\n${closingLine(o)}`;
  return {subject:`Just For Kix — update on your order #${ref}`, body:body};
}

/* AIR / expedited orders: discontinued-showed-0-stock narrative + stock image.
   Returns plain body (for the textarea) AND an html body (for rich paste w/ image). */
function buildAirEmail(o){
  const g=o.greeting||"there", ref=o.order_ref||o.doc;
  const many=o.lines.length>1;
  const names=o.lines.map(ln=>`${ln.sku} (${ln.product})`);
  const itemPhrase = many
    ? `backordered items (${names.join(", ")})`
    : `a backordered item, ${names[0]},`;
  const wasWere = many?"These items were":"This item was";
  const p1=`We are reaching out to inform you that you have ${itemPhrase} on your air shipment selection (order #${ref}). ${wasWere} out of stock, showing 0 stock available at the time of purchase and went to backorder. We should be receiving stock shortly and can resume shipment as soon as stock arrives.`;
  const p2=`Terribly sorry for any inconvenience, please let me know how you'd like to proceed.`;
  const body=`Hi ${g},\n\n${p1}\n\n${p2}`;
  const html=`<p>Hi ${esc(g)},</p><p>${esc(p1)}</p>`
    +`<p><img src="${AIR_IMG}" alt="Stock: only 0 left in stock" style="max-width:100%;width:420px;border:1px solid #d8d8d8;border-radius:6px"></p>`
    +`<p>${esc(p2)}</p>`;
  return {subject:`Just For Kix — update on your order #${ref}`, body:body, html:html, air:true};
}
function buildEmail(o){
  const g=o.greeting||"there", ref=o.order_ref||o.doc, when=mdDate(o.order_date);
  if(o.expedited) return buildAirEmail(o);
  if(o.lines.length>1) return buildMulti(o,g,ref,when);
  let paras=[`Hi ${g},`,
    `I am reaching out regarding your recent order, order #${ref}, placed on ${when}.`];
  o.lines.forEach((ln,i)=>{
    const qn = (ln.bo_qty>1) ? `, with ${ln.bo_qty} backordered on your order` : "";
    const label=`${ln.sku} (${ln.product})`+qn;
    const sels=o._sel[i]||[];
    const list=sels.length ? (sels.length===1?sels[0]
                 :sels.slice(0,-1).join(", ")+" or "+sels[sels.length-1]) : "";
    const many=sels.length>1, plural=ln.bo_qty>1, itPron=plural?"them":"it";
    const far=swapFar(o,i,ln);
    const nextBest=`the next best size${many?"s":""} we have available ${many?"are":"is"} ${list}`;
    if(ln.obsolete){
      if(list){
        const offer = far
          ? `While we don't have a nearing size, ${nextBest} — would you like to swap to ${many?"one of those":"that"}?`
          : `That said, we do have ${list} available — would you like to swap to ${many?"one of those":"that"}?`;
        paras.push(`It seems that we are unfortunately out of ${label}. This is a discontinued item that we will no longer be receiving stock of. ${offer}`);
      }else{
        paras.push(`It seems that we are unfortunately out of ${label}. This is a discontinued item that we will no longer be receiving stock of, and we don't currently have a nearing size or colorway to offer as a swap.`);
      }
    }else{
      const status = ln.is_new
        ? "This is a brand-new item that we are awaiting our first shipment of"
        : "This item is on backorder at the moment";
      if(list){
        const offer = far
          ? `While we don't have a nearing size, ${nextBest}, which we could swap to and ship right out to you.`
          : `we do have ${list} available if you'd like to swap to ${many?"one of those":"that"} and have ${itPron} shipped right out to you.`;
        paras.push(`It seems that we are unfortunately out of ${label}. ${status}${far?". ":", but "}${offer}`);
      }else{
        paras.push(`It seems that we are unfortunately out of ${label}. ${status}, and we'll get ${itPron} shipped out to you just as soon as ${plural?"they're":"it's"} available.`);
      }
    }
  });
  paras.push(closingLine(o));
  return {subject:`Just For Kix — update on your order #${ref}`, body:paras.join("\n\n")};
}
/* separate reply used ONLY if the customer asks when it will arrive */
function buildTimingEmail(o){
  const g=o.greeting||"there", ref=o.order_ref||o.doc;
  const items=o.lines.filter(ln=>!ln.obsolete);   // only backordered/new items have arrival timing
  if(!items.length) return null;
  const etaOf=ln=>(ln.timing&&ln.timing.eta_text)||"soon";
  let mid;
  if(items.length===1){
    const ln=items[0], pron=ln.bo_qty>1?"them":"it";
    mid=`We expect ${ln.sku} (${ln.product}) to arrive at our warehouse ${etaOf(ln)}, and we'll ship ${pron} out to you just as soon as it's received.`;
  }else{
    mid="Here's what we're expecting:\n\n"
      +items.map(ln=>`• ${ln.sku} (${ln.product}) — expected to arrive ${etaOf(ln)}.`).join("\n")
      +"\n\nWe'll ship each item out as soon as it's received.";
  }
  const body=`Hi ${g},\n\nThanks for checking in on the timing for your order #${ref}. ${mid}\n\nPlease let me know if you have any other questions, happy to help!`;
  return {subject:`Just For Kix — timing on your order #${ref}`, body:body};
}

/* ---- render ---- */
function matchOrder(o){
  if(q){const hay=(o.customer+" "+o.doc+" "+o.order_ref+" "+o.emails.join(" ")+" "+
    o.lines.map(l=>l.sku+" "+l.product).join(" ")).toLowerCase();
    if(!hay.includes(q))return false;}
  const st=window.STATUS[o.doc]||{}, contacted=!!(st.emailed||st.called);
  if(filter==="all")return true;
  if(filter==="expedited")return o.expedited;
  if(filter==="refund")return o.needs_refund_only;
  if(filter==="disc")return o.has_discontinued;
  if(filter==="back")return !o.has_discontinued;
  if(filter==="swap")return o.has_swaps;
  if(filter==="contacted")return contacted;
  if(filter==="uncontacted")return !contacted;
  return true;
}
function refreshContactChips(){
  const os=D.orders||[];
  const c=os.filter(o=>{const s=window.STATUS[o.doc]||{};return s.emailed||s.called;}).length;
  $("#c-contacted").textContent=c;
  $("#c-uncontacted").textContent=os.length-c;
}
function swapTag(s,ln){
  if(s.same_color)return '<span class="tag match">same color</span>';
  if(s.size===ln.size)return '<span class="tag match">same size</span>';
  return '<span class="tag">alt</span>';
}
function renderDone(){
  const list=$("#list");
  const _ord=s=>{const p=(s||"").split("/");return p.length===3?(+p[2])*10000+(+p[0])*100+(+p[1]):0;};
  const done=(D.done||[]).slice().sort((a,b)=>_ord(b.resolved_date||b.order_date)-_ord(a.resolved_date||a.order_date));
  $("#empty").textContent="No completed orders yet. An order moves here once its backordered items clear and the sales order is fully billed in NetSuite.";
  $("#empty").style.display=done.length?"none":"block";
  done.forEach(o=>{
    const st=window.STATUS[o.doc]||{};
    const slabel=o.status_label||"Done";
    const sclass=/cancel/i.test(slabel)?"b-discx":/billed|closed/i.test(slabel)?"b-swap":"b-back";
    const card=document.createElement("div");card.className="card donecard";
    card.innerHTML=`
      <div class="cbody">
        <div class="chead">
          <div class="cust"><div class="name">${esc(o.customer)}</div>
            <div class="cid">Order ${esc(o.order_ref||o.doc)}${o.order_date?" · ordered "+esc(o.order_date):""}${o.resolved_date?" · resolved "+esc(o.resolved_date):""}</div></div>
          <div class="refs">
            <div class="ref"><span class="lab">NS Order</span><span class="val">${esc(o.doc)}</span>
              <button class="copy" data-copy="${esc(o.doc)}" data-lab="NS order #">${IC.copy}</button></div>
            ${o.order_ref?`<div class="ref"><span class="lab">${esc(o.channel||"Order")}</span><span class="val">${esc(o.order_ref)}</span>
              <button class="copy" data-copy="${esc(o.order_ref)}" data-lab="Order #">${IC.copy}</button></div>`:""}
            <span class="badge ${sclass}">${esc(slabel)}</span>
          </div>
        </div>
      </div>
      <div class="cside">
        ${st.emailed?'<div class="chkrow on"><span>✓ Emailed</span></div>':""}
        ${st.called?'<div class="chkrow on"><span>✓ Talked on phone</span></div>':""}
        ${st.note?`<div class="nlab">Notes</div><div class="prod">${esc(st.note)}</div>`:""}
      </div>`;
    list.appendChild(card);
  });
}
function render(){
  const list=$("#list");list.innerHTML="";
  if(filter==="donesec"){renderDone();return;}
  const shown=D.orders.filter(matchOrder);
  $("#empty").textContent="No orders match this filter.";
  $("#empty").style.display=shown.length?"none":"block";
  shown.forEach(o=>{
    if(!o._sel)o._sel=o.lines.map(l=>l.swaps.length?[l.swaps[0].sku]:[]);
    const card=document.createElement("div");
    card.className="card"+(o.expedited?" expedited":"")+(o.needs_refund_only?" urgent":"");
    // header
    let refs=`<div class="ref"><span class="lab">NS Order</span><span class="val">${esc(o.doc)}</span>
      <button class="copy" data-copy="${esc(o.doc)}" data-lab="NS order #">${IC.copy}</button></div>`;
    if(o.order_ref && o.order_ref!==o.doc)refs+=`<div class="ref"><span class="lab">${esc(o.channel)}</span><span class="val">${esc(o.order_ref)}</span>
      <button class="copy" data-copy="${esc(o.order_ref)}" data-lab="Order #">${IC.copy}</button></div>`;
    let emails=o.emails.map(e=>`<span class="email"><span class="addr">${esc(e)}</span>
      <button class="copy" data-copy="${esc(e)}" data-lab="Email">${IC.copy}</button></span>`).join("");
    // lines
    let lines=o.lines.map((ln,i)=>{
      let badge = ln.obsolete
        ? (ln.swaps.length? '<span class="badge b-disc">Discontinued</span>'
                          : '<span class="badge b-discx">Discontinued · refund</span>')
        : '<span class="badge b-back">Backordered</span>';
      if(ln.swaps.length) badge+=` <span class="badge b-swap">${ln.swaps.length} swap${ln.swaps.length>1?"s":""} in stock</span>`;
      if(ln.is_new) badge+=' <span class="badge b-new" title="Never had a received PO — brand new item">NEW</span>';
      let timing="";
      if(!ln.obsolete){
        const t=ln.timing;
        timing=`<div class="timing">Est. arrival: <b>${esc(t.eta_text||"—")}</b>`;
        if(t.po)timing+=` · PO <b>${esc(t.po)}</b> (${esc(t.po_date)}) · ${esc(t.vendor||"")}`;
        timing+=`</div>`;
      }else{
        timing=`<div class="timing">Discontinued — no restock.${ln.timing.po?` Last PO ${esc(ln.timing.po)} (${esc(ln.timing.po_date)}).`:""}</div>`;
      }
      // swap dropdown
      let swap="";
      if(ln.swaps.length){
        const rows=ln.swaps.map(s=>{const on=(o._sel[i]||[]).includes(s.sku);
          return `<div class="swaprow${on?" sel":""}" data-sku="${esc(s.sku)}">
          <span class="ssku">${esc(s.sku)}</span>${swapTag(s,ln)}
          <span class="av">avail <b>${s.avail}</b></span>
          <button class="pick${on?" on":""}" data-oi="${i}" data-sku="${esc(s.sku)}">${on?"✓ In email":"Use in email"}</button>
          <button class="copy" data-copy="${esc(s.sku)}" data-lab="SKU">${IC.copy}</button></div>`;}).join("");
        swap=`<details class="swap"><summary><span class="chev">${IC.chev}</span>
          Swap options · ${ln.swaps.length} in stock @ warehouse</summary>
          <div class="swaplist" data-swaplist="${i}">${rows}</div></details>`;
      }else{
        swap=`<div class="noswap">No in-stock swaps at the warehouse${ln.obsolete?" → cancel & refund.":"."}</div>`;
      }
      return `<div class="line">
        <div class="litem">
          <span class="sku">${esc(ln.sku)} <button class="copy" data-copy="${esc(ln.sku)}" data-lab="SKU">${IC.copy}</button></span>
          <span class="prod">${esc(ln.product)}</span>
          <div class="badges">${badge}</div>${timing}
          ${swap}
        </div>
        <div class="lqty"><b>${ln.bo_qty}</b>backordered${ln.on_order?`<br><span>${ln.on_order} on order</span>`:""}</div>
      </div>`;
    }).join("");

    const st = window.STATUS[o.doc] || {};
    card.innerHTML=`
      <div class="cbody">
        <div class="chead">
          <div class="cust"><div class="name">${esc(o.customer)}${o.expedited?` <span class="badge b-air" title="${esc(o.ship_method||"Expedited air")}">✈ ${esc(o.ship_label||"Air")}</span>`:""}</div>
            <div class="cid">Customer ${esc(o.customer_id)} · ordered ${esc(o.order_date)} · flagged ${esc(o.flagged)}${o.phone_email?" · ☎ phone/email order":""}</div></div>
          <div class="refs">${refs}</div>
          <div class="emails">${emails}</div>
        </div>
        <div class="lines">${lines}</div>
        <div class="cfoot">
          <button class="btn primary" data-draft>${IC.mail} Draft email</button>
          <button class="btn ghost" data-copyemails>Copy all emails</button>
          <div class="draftwrap" data-draftwrap>
            <div class="subj"><span class="lab">Subject</span><input data-subj readonly>
            <button class="copy" data-copysubj title="Copy subject">${IC.copy}</button></div>
            <textarea data-body spellcheck="true"></textarea>
            ${o.expedited?`<div class="airimg"><img src="${AIR_IMG}" alt="Stock: only 0 left in stock">
              <div class="airhint">Embedded in the email. Use <b>Copy email + image</b> to paste it inline in Gmail, or drag this image into the message.</div></div>`:""}
            <div class="draftbtns">
              ${o.expedited?`<button class="btn primary" data-copyrich>${IC.copy} Copy email + image</button>
              <button class="btn ghost" data-copybody>${IC.copy} Copy text only</button>`:`<button class="btn primary" data-copybody>${IC.copy} Copy email</button>`}
              <button class="btn ghost" data-mailto>${IC.mail} Open in mail app</button>
            </div>
            <div class="timingwrap" data-timingwrap hidden>
              <div class="nlab">Shipping-timeline reply — send only if they ask when it will arrive</div>
              <textarea data-timing spellcheck="true"></textarea>
              <div class="draftbtns"><button class="btn ghost" data-copytiming>${IC.copy} Copy timing reply</button></div>
            </div>
          </div>
        </div>
      </div>
      <div class="cside">
        <label class="chkrow${st.emailed?" on":""}"><input type="checkbox" data-emailed ${st.emailed?"checked":""}><span>Emailed</span></label>
        <label class="chkrow${st.called?" on":""}"><input type="checkbox" data-called ${st.called?"checked":""}><span>Talked on phone</span></label>
        <div class="nlab">Notes</div>
        <textarea class="cnote" data-note placeholder="Add a comment…">${esc(st.note||"")}</textarea>
        <div class="saved" data-saved>Saved ✓</div>
      </div>`;
    if(st.emailed||st.called) card.classList.add("contacted-on");
    // wire draft
    const refreshDraft=()=>{const em=buildEmail(o);
      card.querySelector("[data-subj]").value=em.subject;
      card.querySelector("[data-body]").value=em.body;
      card._emailHtml=em.html||null;
      const tw=card.querySelector("[data-timingwrap]"), tm=buildTimingEmail(o);
      if(tm&&!o.expedited){tw.hidden=false; card.querySelector("[data-timing]").value=tm.body;}
      else{tw.hidden=true;}};
    refreshDraft();
    card._refresh=refreshDraft;
    card._order=o;
    // wire notes + emailed + called
    const emailedChk=card.querySelector("[data-emailed]"), calledChk=card.querySelector("[data-called]"),
          note=card.querySelector("[data-note]"), savedEl=card.querySelector("[data-saved]");
    const flashSaved=()=>{savedEl.classList.add("show");clearTimeout(savedEl._t);
      savedEl._t=setTimeout(()=>savedEl.classList.remove("show"),1200);};
    const persist=()=>{
      const patch={emailed:emailedChk.checked,called:calledChk.checked,note:note.value};
      window.STATUS[o.doc]={...(window.STATUS[o.doc]||{}),...patch};
      window.saveStatus(o.doc,patch);
      card.classList.toggle("contacted-on", emailedChk.checked||calledChk.checked);
      flashSaved();
    };
    [emailedChk,calledChk].forEach(chk=>chk.addEventListener("change",()=>{
      chk.closest(".chkrow").classList.toggle("on",chk.checked); persist();
      refreshContactChips();
      if(filter==="contacted"||filter==="uncontacted") render();}));
    let noteT;
    note.addEventListener("input",()=>{clearTimeout(noteT);noteT=setTimeout(persist,600);});
    list.appendChild(card);
  });
}

/* ---- events (delegated) ---- */
document.addEventListener("click",e=>{
  const cp=e.target.closest("[data-copy]");
  if(cp){copy(cp.dataset.copy,cp.dataset.lab);return;}
  const pick=e.target.closest(".pick");
  if(pick){
    const card=pick.closest(".card"),o=card._order,oi=+pick.dataset.oi,sku=pick.dataset.sku;
    const arr=o._sel[oi]||(o._sel[oi]=[]);
    const idx=arr.indexOf(sku);
    if(idx>=0) arr.splice(idx,1); else arr.push(sku);   // toggle membership (multi-select)
    const on=arr.includes(sku), row=pick.closest(".swaprow");
    row.classList.toggle("sel",on);
    pick.classList.toggle("on",on);
    pick.textContent=on?"✓ In email":"Use in email";
    card._refresh();toast(on?"Added to email":"Removed from email");return;
  }
  const df=e.target.closest("[data-draft]");
  if(df){const w=df.closest(".cfoot").querySelector("[data-draftwrap]");
    w.classList.toggle("show");if(w.classList.contains("show"))w.scrollIntoView({behavior:"smooth",block:"nearest"});return;}
  const cr=e.target.closest("[data-copyrich]");
  if(cr){copyRich(cr.closest(".card"));return;}
  const cb=e.target.closest("[data-copybody]");
  if(cb){copy(cb.closest(".cfoot").querySelector("[data-body]").value,"Email");return;}
  const ctm=e.target.closest("[data-copytiming]");
  if(ctm){copy(ctm.closest(".cfoot").querySelector("[data-timing]").value,"Timing reply");return;}
  const cs=e.target.closest("[data-copysubj]");
  if(cs){copy(cs.closest(".cfoot").querySelector("[data-subj]").value,"Subject");return;}
  const ce=e.target.closest("[data-copyemails]");
  if(ce){const o=ce.closest(".card")._order;copy(o.emails.join(", "),"Emails");return;}
  const mt=e.target.closest("[data-mailto]");
  if(mt){const card=mt.closest(".card"),o=card._order;
    const subj=encodeURIComponent(card.querySelector("[data-subj]").value);
    const body=encodeURIComponent(card.querySelector("[data-body]").value);
    location.href=`mailto:${encodeURIComponent(o.emails.join(","))}?subject=${subj}&body=${body}`;return;}
  const chip=e.target.closest(".chip");
  if(chip){filter=chip.dataset.f;$$(".chip").forEach(c=>c.setAttribute("aria-pressed",c===chip));render();}
});
// keep selected swap in sync when user edits body manually? body is free text; selection just seeds it.
$("#search").addEventListener("input",e=>{q=e.target.value.trim().toLowerCase();render();});

/* ---- in-page Sync button → launches the Sync Backorders app via URL scheme ---- */
$("#syncBtn").addEventListener("click",()=>{
  const btn=$("#syncBtn"), lbl=$("#syncLbl");
  lbl.textContent="Refreshing\u2026";
  btn.disabled=true; btn.style.opacity=".7"; btn.style.cursor="default";
  // trigger the local sync app; on success it reloads this tab automatically
  liveRefresh(btn,lbl);
  // fallback re-enable if nothing happened (e.g. permission dialog dismissed)
  setTimeout(()=>{ if(document.visibilityState!=="hidden"){
    lbl.textContent="Sync now"; btn.disabled=false; btn.style.opacity=""; btn.style.cursor="pointer"; } },120000);
});

/* ---- init stats ---- */
function init(){
  $("#gen").textContent=D.generated?("Updated "+D.generated):"";
  const os=D.orders;
  $("#s-orders").textContent=D.order_count??os.length;
  $("#s-lines").textContent=D.line_count??os.reduce((a,o)=>a+o.lines.length,0);
  const disc=os.filter(o=>o.has_discontinued).length;
  $("#s-disc").textContent=disc;
  $("#c-all").textContent=os.length;
  $("#c-expedited").textContent=os.filter(o=>o.expedited).length;
  $("#c-refund").textContent=os.filter(o=>o.needs_refund_only).length;
  $("#c-disc").textContent=disc;
  $("#c-back").textContent=os.filter(o=>!o.has_discontinued).length;
  $("#c-swap").textContent=os.filter(o=>o.has_swaps).length;
  $("#c-donesec").textContent=(D.done_count||0);
  refreshContactChips();
  render();
}
init();

/* ---- Supabase auth + snapshot fetch (hosted) ---- */
const supa = window.supabase.createClient(window.SUPA_URL, window.SUPA_KEY);
const gate=$("#authGate"), appRoot=$("#appRoot"), authErr=$("#authErr"), signOutBtn=$("#signOut");
function showErr(m){authErr.textContent=m||"";}
async function loadStatuses(){
  const {data,error}=await supa.from("order_status").select("doc,note,emailed,called");
  window.STATUS={};
  if(!error&&data){data.forEach(function(r){window.STATUS[r.doc]={note:r.note||"",emailed:!!r.emailed,called:!!r.called};});}
}
window.saveStatus=function(doc,patch){
  supa.from("order_status").upsert({doc:doc,note:patch.note||"",emailed:!!patch.emailed,called:!!patch.called,
    updated_at:new Date().toISOString()},{onConflict:"doc"}).then(function(res){
    if(res.error)console.warn("saveStatus failed",res.error);});
};
function backToLogin(msg){
  appRoot.hidden=true; signOutBtn.hidden=true; gate.hidden=false;
  $("#stepEmail")&&($("#stepEmail").hidden=false);
  showErr(msg||"Your session expired — please sign in again.");
}
async function loadSnapshot(){
  // make sure we still have a valid (auto-refreshed) session before fetching
  const {data:{session}} = await supa.auth.getSession();
  if(!session){ backToLogin(); return false; }
  const {data,error} = await supa.from("backorder_snapshot")
    .select("generated_at,payload").eq("id",1).maybeSingle();
  if(error){
    if(/JWT|token|expired|auth/i.test(error.message||"")){ backToLogin(); return false; }
    showErr("Could not load data: "+error.message); return false;
  }
  if(!data){D={orders:[],order_count:0,line_count:0};}
  else {D=data.payload||{orders:[]}; if(data.generated_at){
    D.generated=new Date(data.generated_at).toLocaleString(); window.__snapIso=data.generated_at;}}
  await loadStatuses();
  init();
  return true;
}
function resetRefreshBtn(btn,lbl){ lbl.textContent="Refresh"; btn.disabled=false; btn.style.opacity=""; btn.style.cursor="pointer"; }
async function liveRefresh(btn,lbl){
  lbl.textContent="Refreshing from NetSuite…"; btn.disabled=true; btn.style.opacity=".7"; btn.style.cursor="default";
  const {error}=await supa.from("refresh_request").upsert({id:1,requested_at:new Date().toISOString()},{onConflict:"id"});
  if(error){ toast("Couldn't request refresh: "+error.message); resetRefreshBtn(btn,lbl); return; }
  const t0=Date.now();
  const timer=setInterval(async()=>{
    const {data}=await supa.from("backorder_snapshot").select("generated_at").eq("id",1).maybeSingle();
    if(data && data.generated_at && data.generated_at!==window.__snapIso){
      clearInterval(timer);
      await loadSnapshot();
      resetRefreshBtn(btn,lbl);
      toast("Updated — data from "+new Date(data.generated_at).toLocaleString());
    } else if(Date.now()-t0>120000){
      clearInterval(timer); resetRefreshBtn(btn,lbl);
      toast("Still working — make sure your Mac is on and awake, then try again.");
    }
  },3000);
}
async function enterApp(){
  gate.hidden=true; appRoot.hidden=false; signOutBtn.hidden=false; await loadSnapshot();
}
async function checkSession(){
  const {data:{session}} = await supa.auth.getSession();
  if(session){ enterApp(); }
}
// if the tab regains focus after sleeping, re-check the session so a stale one re-prompts
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible" && !appRoot.hidden){
  supa.auth.getSession().then(({data:{session}})=>{ if(!session) backToLogin(); }); }});
async function doSignIn(){
  const email=$("#authEmail").value.trim(), password=$("#authPass").value; showErr("");
  if(!email||!password){showErr("Enter your email and password.");return;}
  $("#signIn").disabled=true; $("#signIn").textContent="Signing in…";
  const {error}=await supa.auth.signInWithPassword({email,password});
  $("#signIn").disabled=false; $("#signIn").textContent="Sign in";
  if(error){showErr(/Invalid login/i.test(error.message)
    ?"Wrong email or password.":error.message);return;}
  enterApp();
}
$("#signIn").addEventListener("click",doSignIn);
$("#authPass").addEventListener("keydown",e=>{if(e.key==="Enter")doSignIn();});
$("#authEmail").addEventListener("keydown",e=>{if(e.key==="Enter")$("#authPass").focus();});
signOutBtn.addEventListener("click",async()=>{await supa.auth.signOut();location.reload();});
checkSession();

</script>
